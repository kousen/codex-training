spring:
  application:
    name: task-api

  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  cache:
    type: caffeine
    cache-names:
      - tasks
      - task
      - taskSearches
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

logging:
  level:
    com.example.taskapi: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

app:
  security:
    username: admin
    password: changeme
  rate-limit:
    enabled: true
    requests: 100
    window: 1m
