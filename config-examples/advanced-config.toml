# OpenAI Codex - Advanced Configuration Example
# Location: ~/.codex/config.toml
#
# Project-scoped config can also live in .codex/config.toml for trusted projects.

# Model configuration
# Start with gpt-5.5 when it appears in your Codex model picker.
# If you authenticate with an API key, or gpt-5.5 is unavailable, use gpt-5.4.
model = "gpt-5.5"
model_provider = "openai"
model_reasoning_effort = "medium"  # minimal, low, medium, high, xhigh
model_verbosity = "medium"         # low, medium, high
service_tier = "flex"              # flex or fast

# Security and sandbox settings
approval_policy = "on-request"     # untrusted, on-request, never
sandbox_mode = "workspace-write"   # read-only, workspace-write, danger-full-access

[sandbox_workspace_write]
network_access = false             # Network is off unless you explicitly enable it
writable_roots = []                # Add extra writable paths only when needed

# Documentation and web search
project_doc_max_bytes = 32768      # Maximum bytes loaded from AGENTS.md files
web_search = "cached"              # disabled, cached, live

# Stable feature flags
[features]
codex_hooks = true
multi_agent = true
fast_mode = true
undo = false

# Shell environment policy
[shell_environment_policy]
inherit = "core"                   # all, core, none
exclude = ["AWS_SECRET_ACCESS_KEY", "GITHUB_TOKEN", "OPENAI_API_KEY"]

[shell_environment_policy.set]
NODE_ENV = "development"
RUST_LOG = "warn"

# Completion notification command.
# Codex passes a JSON payload to the command on stdin.
# macOS example:
# notify = ["osascript", "-e", "display notification \"Codex task complete\" with title \"Codex\""]
#
# Linux example:
# notify = ["notify-send", "Codex", "Task complete"]

# Profiles for different workflows
[profiles.quick]
model = "gpt-5.4-mini"
model_reasoning_effort = "low"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

[profiles.development]
model = "gpt-5.4"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

[profiles.thorough]
model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# Local OSS profile. Use `codex --oss --local-provider ollama` for local mode.
[profiles.local]
model_provider = "ollama"
model = "qwen2.5-coder:32b"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "disabled"

# Model Context Protocol (MCP) servers
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true

# Remote HTTP server with bearer token from the environment.
# [mcp_servers.example_remote]
# url = "https://example.com/mcp"
# bearer_token_env_var = "EXAMPLE_MCP_TOKEN"
# startup_timeout_sec = 20
# tool_timeout_sec = 60

# Sub-agent limits
[agents]
max_threads = 6
max_depth = 2

# Project trust examples
# [projects."/Users/you/work/trusted-repo"]
# trust_level = "trusted"
