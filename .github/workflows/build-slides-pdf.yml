name: Build & publish slides PDF

on:
  push:
    branches: [main]
    paths:
      - 'slides.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-slides-pdf.yml'
  workflow_dispatch:

concurrency:
  group: slides-pdf
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Export slides to PDF
        # Force the output name: this Slidev version ignores exportFilename for
        # the bare `export` command and would otherwise write slides-export.pdf.
        run: npm run export -- --output codex-training-slides.pdf

      - name: Verify PDF was produced
        # Fail loudly: action-gh-release only warns on a missing file, so without
        # this a renamed/missing export would publish a release with no asset.
        run: |
          test -s codex-training-slides.pdf \
            || { echo "::error::codex-training-slides.pdf is missing or empty — export failed or the output name changed"; exit 1; }

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: slides-latest
          name: Latest slides PDF
          body: |
            Auto-built from `slides.md` at commit ${{ github.sha }}.

            Download: [`codex-training-slides.pdf`](https://github.com/${{ github.repository }}/releases/latest/download/codex-training-slides.pdf)
          files: codex-training-slides.pdf
          make_latest: true
