[tox]
env_list = py310, py311, py312, py313, py314
skip_missing_interpreters = true

[testenv]
description = run the complete suite on Python {base_python}
package = wheel
wheel_build_env = .pkg
deps =
    build>=1.2.0
    hypothesis>=6.92.0
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-timeout>=2.4.0
commands =
    pytest --cov --cov-report=term-missing
