# OpenAI Codex - Advanced Configuration Example
# Location: ~/.codex/config.toml
#
# Project-scoped config can also live in .codex/config.toml for trusted projects.

# Model configuration
# gpt-5.6-sol is the current frontier default (siblings: gpt-5.6-terra,
# gpt-5.6-luna; older models gpt-5.5 / gpt-5.4 remain available).
model = "gpt-5.6-sol"
model_provider = "openai"
model_reasoning_effort = "medium"  # low, medium, high, xhigh, max, ultra ("minimal" is legacy)
model_verbosity = "medium"         # low, medium, high
service_tier = "flex"              # flex or fast

# Security and sandbox settings
approval_policy = "on-request"     # on-request, never ("untrusted" was retired in 0.149)
sandbox_mode = "workspace-write"   # read-only, workspace-write, danger-full-access

# Documentation and web search
project_doc_max_bytes = 32768      # Maximum bytes loaded from AGENTS.md files
web_search = "cached"              # disabled, cached, indexed, live

# Completion notification command (top-level key — keep it above any [table]).
# Codex passes a JSON payload to the command on stdin. macOS example:
# notify = ["osascript", "-e", "display notification \"Codex task complete\" with title \"Codex\""]
# Linux: notify = ["notify-send", "Codex", "Task complete"]

# NOTE: everything below a [table] header belongs to that table until the
# next header — keep all top-level keys above this line.

[sandbox_workspace_write]
network_access = false             # Network is off unless you explicitly enable it
writable_roots = []                # Add extra writable paths only when needed

# Stable feature flags (check names with `codex features list`;
# unknown names fail silently, even under --strict-config)
[features]
hooks = true        # stable, on by default — shown here for visibility
multi_agent = true
fast_mode = true

# Shell environment policy
[shell_environment_policy]
inherit = "core"                   # all, core, none
exclude = ["AWS_SECRET_ACCESS_KEY", "GITHUB_TOKEN", "OPENAI_API_KEY"]

[shell_environment_policy.set]
NODE_ENV = "development"
RUST_LOG = "warn"

# Profiles for different workflows
# Since 0.134, [profiles.*] tables in config.toml are REJECTED — the CLI
# refuses to start. Each profile is now its own file with top-level keys:
#   ~/.codex/<name>.config.toml     (selected with: codex --profile <name>)
# See quick.config.toml, development.config.toml, thorough.config.toml,
# and local.config.toml in this directory; copy them into ~/.codex/.

# Model Context Protocol (MCP) servers
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true

# Remote HTTP server with bearer token from the environment.
# [mcp_servers.example_remote]
# url = "https://example.com/mcp"
# bearer_token_env_var = "EXAMPLE_MCP_TOKEN"
# startup_timeout_sec = 20
# tool_timeout_sec = 60

# Sub-agent limits
[agents]
max_threads = 6
max_depth = 2

# Project trust examples
# [projects."/Users/you/work/trusted-repo"]
# trust_level = "trusted"
