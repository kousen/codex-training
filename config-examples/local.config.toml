# Profile: local — open-weights model via Ollama
# Install: cp local.config.toml ~/.codex/   Use: codex --profile local
# Pull the model first (ollama pull qwen2.5-coder:32b) or change `model` to one from `ollama list`.
# Adding --oss replaces `model` with the provider's default.
model_provider = "ollama"
model = "qwen2.5-coder:32b"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "disabled"
