[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-processor-refactor"
version = "0.1.0"
description = "Refactored data processing pipeline for the Python refactoring exercise."
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = [
  "--cov=legacy_processor",
  "--cov=src",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--no-cov-on-fail",
]

[tool.coverage.run]
branch = true
source = ["legacy_processor", "src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
