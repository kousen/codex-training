repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^exercises/python-refactoring/starter/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^exercises/python-refactoring/starter/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args:
          [
            "exercises/python-refactoring/starter/legacy_processor.py",
            "exercises/python-refactoring/starter/src",
            "exercises/python-refactoring/starter/tests",
            "exercises/python-refactoring/starter/examples",
          ]
        pass_filenames: false
        files: ^exercises/python-refactoring/starter/
        additional_dependencies:
          - pytest>=7.4.0
          - hypothesis>=6.155.7
