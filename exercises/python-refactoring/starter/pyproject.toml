[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-python-refactoring"
version = "0.1.0"
description = "Refactored Python training project for the Codex CLI course"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kousen IT" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.155.7",
    "mypy>=1.7.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "pre-commit>=4.5.0",
    "build>=1.3.0",
]

[project.scripts]
legacy-processor = "legacy_processor:main"
calculator-example = "examples.calculator_strategy_example:main"
data-pipeline-example = "examples.data_processing_pipeline_example:main"

[tool.setuptools]
py-modules = ["legacy_processor"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "examples*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
