name: Python refactoring exercise

on:
  pull_request:
    paths:
      - "exercises/python-refactoring/starter/**"
      - ".github/workflows/python-refactoring.yml"
  push:
    paths:
      - "exercises/python-refactoring/starter/**"
      - ".github/workflows/python-refactoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: exercises/python-refactoring/starter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: exercises/python-refactoring/starter/pyproject.toml

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: black --check legacy_processor.py src tests

      - name: Lint
        run: ruff check legacy_processor.py src tests

      - name: Type check
        run: mypy legacy_processor.py src tests

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Test
        run: pytest --cov --cov-report=term-missing
