# OpenAI Codex - Basic Configuration
# Location: ~/.codex/config.toml
#
# This is a minimal configuration to get started.
# See advanced-config.toml for all available options.

# Model Selection
# Start with gpt-5.5 when it is available in your Codex model picker.
# If you authenticate with an API key, or gpt-5.5 is not available yet,
# use gpt-5.4 instead.
model = "gpt-5.5"

# Security Settings
# untrusted: Only trusted commands run without prompting
# on-request: Ask before risky actions (recommended for beginners)
# never: Never ask (for automation; pair with a restrictive sandbox)
approval_policy = "on-request"

# Sandbox Mode
# read-only: Only allow read operations
# workspace-write: Allow writes only in current workspace
# danger-full-access: No restrictions (use with caution)
sandbox_mode = "workspace-write"

# Project Documentation
# Maximum bytes to read from AGENTS.md files
project_doc_max_bytes = 32768

# Web Search
# cached: use OpenAI's maintained search index without live page fetches
# live: fetch current web pages when freshness matters
# disabled: remove web search from the session
web_search = "cached"

# That's it! This basic config is enough to get started.
#
# Next steps:
# 1. Run: codex login
# 2. Navigate to a project with an AGENTS.md file
# 3. Start coding: codex "help me understand this codebase"
#
# For MCP servers, profiles, and advanced options,
# see advanced-config.toml
