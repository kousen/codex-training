# Application
spring.application.name=task-api

# H2 Database
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Development server
server.port=8080
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# JSON enum values must be names, never numeric ordinals
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Development logging
logging.level.com.example.taskapi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Seed a few development tasks; disable for an empty database
app.sample-data.enabled=true
