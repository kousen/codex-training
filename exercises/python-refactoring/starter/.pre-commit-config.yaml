minimum_pre_commit_version: "4.6.2"
files: ^exercises/python-refactoring/starter/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: >-
          mypy
          --config-file=exercises/python-refactoring/starter/pyproject.toml
          exercises/python-refactoring/starter/legacy_processor.py
          exercises/python-refactoring/starter/src
          exercises/python-refactoring/starter/tests
        language: system
        pass_filenames: false
        always_run: true
